<header>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Caveat+Brush&family=Anton&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pacifico&display=swap" rel="stylesheet">
</header>

<div class="wrapper">
    <section class="modern-hero">
        <!-- Izquierda: Collage de píldoras -->
        <div class="collage-container">
            <div class="pill-group">
                <!-- La imagen real, derecha y completa, cortada por las píldoras -->
                <div class="image-collage-mask"></div>

                <!-- Decorative solid pills -->
                <div class="pill decorative-pill blue-pill pos-1"></div>
                <div class="pill decorative-pill yellow-pill pos-2"></div>
                <div class="pill decorative-pill yellow-pill pos-6"></div>
                <div class="pill decorative-pill blue-pill pos-7"></div>
            </div>
        </div>
        
        <!-- Derecha: Texto -->
        <div class="hero-text-container">


            <div class="brand-header">
                <img src="assets/img/logoupscolor.png" alt="Logo UPS" class="hero-logo" />
            </div>

            <h1 class="main-title">
                JORNADAS DE <br>
                <span class="highlight">FORMACIÓN</span> DOCENTE
            </h1>

            <div class="top-tag">
                <span class="tag-text">Sede Quito</span>
                <span class="tag-divider">•</span>
                <span class="tag-text">Periodo 2026 - 2027</span>
            </div>

            <div class="scroll-cue" style="margin-top: 15px;">
                <i class="fas fa-arrow-down" style="color: #ffcc00;"></i> Desliza para ver el cronograma
            </div>
        </div>
    </section>

    <div class="main-content">
        <app-calendar></app-calendar>
    </div>
</div>
